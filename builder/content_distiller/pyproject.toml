[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "content_distiller"
dynamic = ["version"]
dependencies = [
  "langchain-core",
  "nat_helpers",
  "pydantic>=2,<2.14",
]
requires-python = ">=3.11,<3.14"
description = "Secondary LLM content distillation for Daedalus."
classifiers = ["Programming Language :: Python"]

[tool.setuptools]
packages = ["content_distiller"]
package-dir = {"" = "src"}

[tool.uv]
config-settings = { editable_mode = "compat" }
