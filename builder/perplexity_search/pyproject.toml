[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "perplexity_search"
dynamic = ["version"]
dependencies = [
  "httpx>=0.28",
  "pydantic>=2,<2.14",
]
requires-python = ">=3.11,<3.14"
description = "Daedalus function for Perplexity Search API web results"
classifiers = ["Programming Language :: Python"]

[tool.setuptools]
packages = ["perplexity_search"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
perplexity_search = ["configs/*.yml", "configs/*.yaml"]

[tool.uv]
config-settings = { editable_mode = "compat" }
