[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "webscrape"
dynamic = ["version"]
dependencies = [
  "nat_helpers",
  "httpx>=0.28",
  # Keep document converters without the unused audio-transcription extra.
  "markitdown[az-content-understanding,az-doc-intel,docx,outlook,pdf,pptx,xls,xlsx,youtube-transcription]",
  "pydantic>=2,<2.14",
  "tiktoken>=0.5.0",
]
requires-python = ">=3.11,<3.14"
description = "Custom Daedalus Workflow"
classifiers = ["Programming Language :: Python"]



[tool.setuptools]
packages = ["webscrape"]
package-dir = {"" = "src"}

[tool.uv]
config-settings = { editable_mode = "compat" }
