[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "webscrape"
dynamic = ["version"]
dependencies = [
  "nat_helpers",
  "httpx>=0.28",
  "markitdown[all]",
  "pydantic>=2,<2.14",
  "tiktoken>=0.5.0",
]
requires-python = ">=3.11,<3.14"
description = "Custom Daedalus Workflow"
classifiers = ["Programming Language :: Python"]



[tool.setuptools]
packages = ["webscrape"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
webscrape = ["configs/*.yml", "configs/*.yaml"]

[tool.uv]
config-settings = { editable_mode = "compat" }
