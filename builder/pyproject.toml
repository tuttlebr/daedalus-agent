[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-tests"
version = "0.1.0"
requires-python = ">=3.11"
description = "Test suite for Daedalus builder packages"

[project.optional-dependencies]
test = [
    "c2pa-python==0.37.10",
    "pytest>=9.0.3",
    "pytest-cov>=5",
    "pydantic>=2",
    "httpx>=0.28",
    "requests>=2.33.0",
    "idna>=3.15",
    "pyyaml>=6",
    "pillow>=12.2,<13",
    "httpcore>=0.18",
]

[tool.setuptools]
packages = []
