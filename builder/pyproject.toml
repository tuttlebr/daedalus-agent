[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-tests"
version = "0.1.0"
requires-python = ">=3.11"
description = "Test suite for Daedalus builder packages"

[project.optional-dependencies]
test = [
    "cachetools>=6.2.1",
    "certifi>=2026.10.19,<2027",
    "c2pa-python==0.37.10",
    "pytest>=9.0.3",
    "pytest-cov>=5",
    "pydantic>=2",
    "httpx>=0.28",
    "mcp>=1.26,<2",
    "opentelemetry-api>=1.41,<2",
    "jsonschema>=4.25,<5",
    "requests>=2.33.0",
    "urllib3>=2.8,<3",
    "idna>=3.15",
    "pyyaml>=6",
    "pillow>=13.0.0,<14",
    "httpcore>=0.18",
]

[tool.setuptools]
packages = []
