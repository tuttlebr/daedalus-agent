[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "agent_skills"
dynamic = ["version"]
dependencies = [
  "pydantic>=2,<2.14",
  "pyyaml>=6.0",
]
requires-python = ">=3.11,<3.14"
description = "Agent Skills loader for Daedalus — discovers, loads, and executes Anthropic-style SKILL.md skill directories."
classifiers = ["Programming Language :: Python"]

[tool.setuptools]
packages = ["agent_skills"]
package-dir = {"" = "src"}

[tool.uv]
config-settings = { editable_mode = "compat" }
