[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=64.0.0", "wheel"]

[project]
name = "source_verifier"
dynamic = ["version"]
dependencies = [
  "httpx>=0.28",
  "langchain-core",
  "nat_helpers",
  "pydantic>=2,<2.14",
  "webscrape",
]
requires-python = ">=3.11,<3.14"
description = "Source citation verification for Daedalus. Validates that claimed sources actually support stored findings before they enter memory."
classifiers = ["Programming Language :: Python"]

[tool.setuptools]
packages = ["source_verifier"]
package-dir = {"" = "src"}

[tool.uv]
config-settings = { editable_mode = "compat" }
