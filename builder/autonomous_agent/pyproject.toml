[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Daedalus autonomous agent worker"
dependencies = [
    "pydantic>=2,<2.14",
    "httpx>=0.27,<1",
    "redis>=4.3.6,<6",
    "user_interaction",
]

[tool.setuptools.packages.find]
where = ["src"]
