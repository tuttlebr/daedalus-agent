general:
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: console

workflow:
  _type: rss_feed

  # RSS Feed URL (required)
  feed_url: null # e.g., "https://feeds.arstechnica.com/arstechnica/technology-lab"

  # Reranker configuration (required)
  reranker_endpoint: null # e.g., "http://reranker:8000/rerank"
  reranker_model: null # e.g., "nvidia/llama-nemotron-rerank-1b-v2"
  reranker_api_key: null # Optional; can also be set via NVIDIA_API_KEY
  reranker_max_passage_tokens: 192
  reranker_max_total_tokens: 7000

  # Cache configuration
  cache_ttl_hours: 4.0

  # Request configuration
  timeout: 30.0
  user_agent: 'daedalus-rss-reader/1.0'
  max_entries: 20 # Maximum RSS entries to process
