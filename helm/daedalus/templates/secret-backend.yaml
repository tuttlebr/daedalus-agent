{{- if and .Values.backend.default.enabled (not .Values.backend.default.env.fromSecret) .Values.backend.default.env.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "daedalus.fullname" . }}-backend-env
  labels:
    {{- include "daedalus.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.backend.default.env.data }}
{{- if not (regexMatch "^(DAEDALUS_PHOENIX_ENDPOINT|DAEDALUS_(RAG_READINESS_MODE|REQUIRED_COLLECTIONS|MCP_OAUTH_TIMEOUT_SECONDS)|PHOENIX_(PROJECT_NAME|API_KEY|CLIENT_HEADERS)|OTEL_EXPORTER_OTLP_HEADERS|ARIZE_[A-Z0-9_]+|KUBERNETES_MCP_(SERVER|TOKEN)|UNIFI_MCP_(SERVER|TOKEN)|X_MCP_BEARER_TOKEN|DAEDALUS_REQUIRED_MCP_GROUPS|GOOGLE_MCP_(CLIENT_ID|CLIENT_SECRET|REDIRECT_URI)|LLM_SANDBOX_(BASE_URL|API_KEY)|MILVUS_[A-Z0-9_]+|MINIO_[A-Z0-9_]+|NV_INGEST_(HOST|PORT)|TOKENIZER|DOCUMENT_INGEST_(REQUEST_LIMIT|CHUNK_(SIZE|OVERLAP)|DEFAULT_COLLECTION|EXTRACT_METHOD|USE_V2_API|PDF_PAGES_PER_CHUNK|ENABLE_(IMAGE_FILTER|CAPTIONING)|WORKER_POOL_SIZE|BATCH_CONCURRENCY|MAX_(DOCUMENTS_PER_BATCH|SIZE_BYTES|RETRIES)|REDIS_(SOCKET|CONNECT)_TIMEOUT|TIMEOUT_SECONDS|RETRY_DELAY)|NVIDIA_API_KEY|OPENAI_API_KEY|VERIFIER_(API_KEY|BASE_URL|MODEL)|PERPLEXITY_SEARCH_API_KEY|GITHUB_PAT|IMAGE_(AUGMENTATION|COMPREHENSION|GENERATION)_[A-Z0-9_]+|EMBEDDING_[A-Z0-9_]+|RERANKER_[A-Z0-9_]+|(DEFAULT|TOOL_CALLING)_LLM_MODEL_[A-Z0-9_]+|DAEDALUS_LLM_[A-Z0-9_]+|NAT_(CONFIG_FILE|HOST|PORT|LOG_LEVEL)|LOG_LEVEL|APPROVAL_REDIS_URL|AUTONOMY_IDEMPOTENCY_TTL_SECONDS)$" $k) }}
{{- fail (printf "backend.default.env.data key %s is not in the backend workload allowlist" $k) }}
{{- end }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
