{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "daedalus.fullname" . }}-redis-init
  labels:
    {{- include "daedalus.labels" . | nindent 4 }}
data:
  init-redis.sh: |
    #!/bin/bash
    set -e

    # Forward SIGTERM to the Redis process so Kubernetes graceful
    # shutdown triggers a clean Redis SAVE before exit.
    cleanup() {
      echo "Received shutdown signal, forwarding to Redis (PID $REDIS_PID)..."
      kill -TERM "$REDIS_PID" 2>/dev/null
      wait "$REDIS_PID"
      echo "Redis stopped."
      exit 0
    }
    trap cleanup SIGTERM SIGINT

    echo "Starting Redis with modules..."

    AUTH_ARGS=()
    if [[ -n "${REDIS_PASSWORD:-}" ]]; then
      if [[ ! "${REDIS_USERNAME:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
        echo "ERROR: REDIS_USERNAME contains unsupported characters" >&2
        exit 1
      fi
      umask 077
      acl_hash() {
        printf '%s' "$1" | sha256sum | awk '{print $1}'
      }
      write_acl_user() {
        local username="$1" password="$2" previous_password="$3"
        local key_patterns="$4" channel_patterns="$5"
        if [[ ! "$username" =~ ^[A-Za-z0-9._-]+$ || -z "$password" ]]; then
          echo "ERROR: Redis workload user configuration is invalid" >&2
          exit 1
        fi
        printf 'user %s on #%s' "$username" "$(acl_hash "$password")"
        if [[ -n "$previous_password" && "$previous_password" != "$password" ]]; then
          printf ' #%s' "$(acl_hash "$previous_password")"
        fi
        printf ' %s' "$key_patterns"
        if [[ -n "$channel_patterns" ]]; then
          printf ' %s' "$channel_patterns"
        fi
        printf ' +@all -@dangerous +info\n'
      }
      if [[ "$REDIS_USERNAME" == "$REDIS_BACKEND_USERNAME" ||
            "$REDIS_USERNAME" == "$REDIS_STREAM_WORKER_USERNAME" ||
            "$REDIS_USERNAME" == "$REDIS_AUTONOMOUS_USERNAME" ||
            "$REDIS_BACKEND_USERNAME" == "$REDIS_STREAM_WORKER_USERNAME" ||
            "$REDIS_BACKEND_USERNAME" == "$REDIS_AUTONOMOUS_USERNAME" ||
            "$REDIS_STREAM_WORKER_USERNAME" == "$REDIS_AUTONOMOUS_USERNAME" ]]; then
        echo "ERROR: Redis workload usernames must be distinct" >&2
        exit 1
      fi
      # Redis replays AOF transactions as the default ACL user. An entirely
      # disabled default user makes EXEC reject replayed Stream PEL updates,
      # even though ordinary keys load successfully. Keep that internal user
      # permission-complete but network-inaccessible behind a fresh password
      # hash whose random preimage is never stored or exposed.
      AOF_REPLAY_HASH=$(dd if=/dev/urandom bs=32 count=1 2>/dev/null | sha256sum | awk '{print $1}')
      {
        printf 'user default on #%s ~* &* +@all\n' "$AOF_REPLAY_HASH"
        # The request-serving frontend owns authentication and user state.
        write_acl_user "$REDIS_USERNAME" "$REDIS_PASSWORD" \
          "${REDIS_PREVIOUS_PASSWORD:-}" '~*' '&*'
        # The backend can access tool/runtime state but cannot read sessions,
        # login counters, conversations, autonomy state, or general user keys.
        write_acl_user "$REDIS_BACKEND_USERNAME" "$REDIS_BACKEND_PASSWORD" \
          "${REDIS_BACKEND_PREVIOUS_PASSWORD:-}" \
          '~nat:* ~nat/* ~approval:* ~approval-pending:* ~approval-receipt:* ~document:* ~generated:* ~image:* ~user:*:image:* ~rss_feed:* ~daedalus:*' ''
        # The stream worker receives only async execution/finalization state and
        # its exact realtime channels; authentication keyspaces stay excluded.
        write_acl_user "$REDIS_STREAM_WORKER_USERNAME" "$REDIS_STREAM_WORKER_PASSWORD" \
          "${REDIS_STREAM_WORKER_PREVIOUS_PASSWORD:-}" \
          '~async-* ~conversation:* ~conversation-job:* ~streaming:user:*:conversation:* ~user:* ~memory-retention:* ~mcp-oauth-callback:* ~mcp-approval-status:* ~document:* ~session-documents:* ~generated:* ~image:* ~image-job:*' \
          '&job:*:status &user:*:chat:*:tokens &user:*:updates'
        # The autonomous process owns only autonomy state, its persisted
        # workspace notes, and its update topic.
        write_acl_user "$REDIS_AUTONOMOUS_USERNAME" "$REDIS_AUTONOMOUS_PASSWORD" \
          "${REDIS_AUTONOMOUS_PREVIOUS_PASSWORD:-}" \
          '~autonomy:* ~autonomous:*:workspace:*' '&user:*:updates'
      } >/tmp/users.acl
      AUTH_ARGS=(--aclfile /tmp/users.acl)
    fi

    TLS_ARGS=()
    if [[ "${REDIS_TLS_ENABLED:-false}" == "true" ]]; then
      TLS_ARGS=(
        --port 0
        --tls-port 6379
        --tls-cert-file "$REDIS_TLS_CERT_FILE"
        --tls-key-file "$REDIS_TLS_KEY_FILE"
        --tls-ca-cert-file "$REDIS_TLS_CA_FILE"
        --tls-auth-clients no
      )
    fi

    # Start Redis in the background with all required modules.
    # --dir /data ensures RDB and AOF are written to the PVC mount.
    # Without maxmemory Redis grows to the container limit and is OOMKilled
    # rather than evicting. With replicas: 1 and strategy Recreate that is a
    # full outage plus an AOF replay. volatile-lru evicts only keys that carry
    # a TTL (job state, sessions, conversations, uploads); durable records such
    # as autonomy goals and user accounts have none and are never evicted.
    redis-server \
      --dir /data \
      --save 60 1 \
      --appendonly yes \
      --protected-mode yes \
      --maxmemory {{ .Values.redis.maxmemory | default "6gb" }} \
      --maxmemory-policy {{ .Values.redis.maxmemoryPolicy | default "volatile-lru" }} \
      "${AUTH_ARGS[@]}" \
      "${TLS_ARGS[@]}" \
      --loadmodule /opt/redis-stack/lib/rejson.so \
      --loadmodule /opt/redis-stack/lib/redisearch.so \
      --loadmodule /opt/redis-stack/lib/redistimeseries.so \
      --loadmodule /opt/redis-stack/lib/redisbloom.so &

    REDIS_PID=$!
    wait $REDIS_PID
{{- end }}
