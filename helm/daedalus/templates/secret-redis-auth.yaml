{{- if and .Values.redis.enabled .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- $secretName := printf "%s-redis-auth" (include "daedalus.fullname" .) }}
{{- $secretKey := .Values.redis.auth.secretKey | default "REDIS_PASSWORD" }}
{{- $previousSecretKey := .Values.redis.auth.previousSecretKey | default "REDIS_PREVIOUS_PASSWORD" }}
{{- $providedPassword := .Values.redis.auth.password | default "" }}
{{- $providedPreviousPassword := .Values.redis.auth.previousPassword | default "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingPassword := "" }}
{{- if $existing }}
{{- $existingPassword = default "" (get ($existing.data | default dict) $secretKey) }}
{{- if $existingPassword }}{{ $existingPassword = $existingPassword | b64dec }}{{ end }}
{{- end }}
{{- $password := $providedPassword }}
{{- if not $password }}{{ $password = $existingPassword }}{{ end }}
{{- if not $password }}{{ $password = randAlphaNum 64 }}{{ end }}
{{- $previousPassword := $providedPreviousPassword }}
{{- $backendSecretKey := .Values.redis.auth.backendSecretKey | default "REDIS_BACKEND_PASSWORD" }}
{{- $backendPreviousSecretKey := .Values.redis.auth.backendPreviousSecretKey | default "REDIS_BACKEND_PREVIOUS_PASSWORD" }}
{{- $backendPassword := .Values.redis.auth.backendPassword | default "" }}
{{- $backendPreviousPassword := .Values.redis.auth.backendPreviousPassword | default "" }}
{{- $streamSecretKey := .Values.redis.auth.streamWorkerSecretKey | default "REDIS_STREAM_WORKER_PASSWORD" }}
{{- $streamPreviousSecretKey := .Values.redis.auth.streamWorkerPreviousSecretKey | default "REDIS_STREAM_WORKER_PREVIOUS_PASSWORD" }}
{{- $streamPassword := .Values.redis.auth.streamWorkerPassword | default "" }}
{{- $streamPreviousPassword := .Values.redis.auth.streamWorkerPreviousPassword | default "" }}
{{- $autonomousSecretKey := .Values.redis.auth.autonomousSecretKey | default "REDIS_AUTONOMOUS_PASSWORD" }}
{{- $autonomousPreviousSecretKey := .Values.redis.auth.autonomousPreviousSecretKey | default "REDIS_AUTONOMOUS_PREVIOUS_PASSWORD" }}
{{- $autonomousPassword := .Values.redis.auth.autonomousPassword | default "" }}
{{- $autonomousPreviousPassword := .Values.redis.auth.autonomousPreviousPassword | default "" }}
{{- if $existing }}
{{- if not $backendPassword }}{{ $backendPassword = default "" (get ($existing.data | default dict) $backendSecretKey) }}{{ if $backendPassword }}{{ $backendPassword = $backendPassword | b64dec }}{{ end }}{{ end }}
{{- if not $streamPassword }}{{ $streamPassword = default "" (get ($existing.data | default dict) $streamSecretKey) }}{{ if $streamPassword }}{{ $streamPassword = $streamPassword | b64dec }}{{ end }}{{ end }}
{{- if not $autonomousPassword }}{{ $autonomousPassword = default "" (get ($existing.data | default dict) $autonomousSecretKey) }}{{ if $autonomousPassword }}{{ $autonomousPassword = $autonomousPassword | b64dec }}{{ end }}{{ end }}
{{- end }}
{{- if not $backendPassword }}{{ $backendPassword = randAlphaNum 64 }}{{ end }}
{{- if not $streamPassword }}{{ $streamPassword = randAlphaNum 64 }}{{ end }}
{{- if not $autonomousPassword }}{{ $autonomousPassword = randAlphaNum 64 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "daedalus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secretKey }}: {{ $password | quote }}
  {{ $previousSecretKey }}: {{ $previousPassword | quote }}
  {{ $backendSecretKey }}: {{ $backendPassword | quote }}
  {{ $backendPreviousSecretKey }}: {{ $backendPreviousPassword | quote }}
  {{ $streamSecretKey }}: {{ $streamPassword | quote }}
  {{ $streamPreviousSecretKey }}: {{ $streamPreviousPassword | quote }}
  {{ $autonomousSecretKey }}: {{ $autonomousPassword | quote }}
  {{ $autonomousPreviousSecretKey }}: {{ $autonomousPreviousPassword | quote }}
{{- end }}
